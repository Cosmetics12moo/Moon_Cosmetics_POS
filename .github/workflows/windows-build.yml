name: Moon Cosmetics POS - Windows Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Verify Flutter environment
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform files
        shell: pwsh
        run: flutter create --platforms=windows --project-name=moon_cosmetics_pos .

      - name: Resolve dependencies
        shell: pwsh
        run: flutter pub get

      - name: Static analysis
        shell: pwsh
        run: flutter analyze

      - name: Run tests
        shell: pwsh
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: |
          if (Test-Path moon_cosmetics_pos_windows.zip) { Remove-Item moon_cosmetics_pos_windows.zip -Force }
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'moon_cosmetics_pos_windows.zip' -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: moon_cosmetics_pos-windows
          path: moon_cosmetics_pos_windows.zip
          if-no-files-found: error
          retention-days: 30
